[project]
name = "valutatrade-hub"
version = "0.1.0"
authors = [{name = "Naumov Pavel"}]
description = "Симулятор валютного портфеля"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ['prettytable>=3.12,<4', 'requests>=2.32,<3']

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
logs_dir = "logs"
rates_ttl_seconds = 300
base_currency = "USD"
